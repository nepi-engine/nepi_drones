driver:
  pkg_name: RBX_SIM
  display_name: Gazebo Simulated Robot
  description: Driver package for Gazebo-simulated robots (Universal Simulator Bridge)
  type: RBX
  group_id: SIM
  NODE_DICT:
    file_name: rbx_sim_node.py
    class_name: SimNode
  DRIVER_DICT:
    file_name: None
    class_name: None
  DISCOVERY_DICT:
    file_name: rbx_sim_discovery.py
    class_name: SimDiscovery
    process: CALL
    OPTIONS:
      connection:
        type: Discrete
        options:
          - SIMULATOR
        default: SIMULATOR
        value: SIMULATOR
